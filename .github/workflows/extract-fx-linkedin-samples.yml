name: Inspect FX workbook pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-fx-linkedin-samples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PDF reader
        run: python -m pip install --quiet pypdf
      - name: Print page map
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          path='assets/resources/50_FX_Derivatives_Quant_Interview_Problems.pdf'
          r=PdfReader(path)
          print(f'PAGE_COUNT={len(r.pages)}')
          for i,p in enumerate(r.pages,1):
              text=' '.join((p.extract_text() or '').split())
              print(f'PAGE {i}: {text[:700]}')
          PY
