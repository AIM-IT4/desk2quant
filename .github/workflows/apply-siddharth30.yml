name: Apply SIDDHARTH30 offer patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-siddharth30.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded coupon patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_bytes(path, old, new, expected_count=1, replace_count=None):
              p = Path(path)
              data = p.read_bytes()
              found = data.count(old)
              if found != expected_count:
                  raise SystemExit(f"{path}: expected {expected_count} occurrence(s), found {found}: {old!r}")
              if replace_count is None:
                  updated = data.replace(old, new)
              else:
                  updated = data.replace(old, new, replace_count)
              p.write_bytes(updated)

          # Server-side pricing authority: allow the one-off code for products
          # and cart items. The second VASUDHA30 occurrence is session pricing
          # and is deliberately left unchanged.
          replace_bytes(
              'lib/pricing.js',
              b"if (inputCodeUpper === 'VASUDHA30') return 30;",
              b"if (inputCodeUpper === 'VASUDHA30' || inputCodeUpper === 'SIDDHARTH30') return 30;",
              expected_count=2,
              replace_count=1,
          )

          # Homepage product modal and cart drawer client-side feedback.
          replace_bytes(
              'script.js',
              b"} else if (inputCodeUpper && inputCodeUpper === 'VASUDHA30') {",
              b"} else if (inputCodeUpper && (inputCodeUpper === 'VASUDHA30' || inputCodeUpper === 'SIDDHARTH30')) {",
          )
          replace_bytes(
              'script.js',
              b"if (inputCodeUpper === 'VASUDHA30') return { valid: true, percent: 30 };",
              b"if (inputCodeUpper === 'VASUDHA30' || inputCodeUpper === 'SIDDHARTH30') return { valid: true, percent: 30 };",
          )

          # Standalone product page checkout.
          replace_bytes(
              'product.html',
              b"} else if (inputCodeUpper && inputCodeUpper === 'VASUDHA30') {",
              b"} else if (inputCodeUpper && (inputCodeUpper === 'VASUDHA30' || inputCodeUpper === 'SIDDHARTH30')) {",
          )

          # Recommendation-email renderer: make percentage, subject and text
          # prices agree with this 30% code instead of silently advertising 20%.
          replace_bytes(
              'lib/recommendationEmail.js',
              b"const discountPct = 20;",
              b"const discountPct = String(couponCode || '').trim().toUpperCase() === 'SIDDHARTH30' ? 30 : 20;",
          )
          replace_bytes(
              'lib/recommendationEmail.js',
              b"p.price * 0.8",
              b"p.price * (1 - discountPct / 100)",
          )
          replace_bytes(
              'lib/recommendationEmail.js',
              b"subject: `${customerName}, here's an exclusive 20% off on our top quant resources 🎯`,",
              b"subject: `${customerName}, here's an exclusive ${discountPct}% off on our top quant resources 🎯`,",
          )
          PY

      - name: Verify syntax and coupon coverage
        shell: bash
        run: |
          node --check script.js
          node --check lib/pricing.js
          node --check lib/recommendationEmail.js
          python - <<'PY'
          from pathlib import Path

          checks = {
              'lib/pricing.js': ["'SIDDHARTH30') return 30"],
              'script.js': ["inputCodeUpper === 'SIDDHARTH30'", "percent: 30"],
              'product.html': ["inputCodeUpper === 'SIDDHARTH30'"],
              'lib/recommendationEmail.js': ["SIDDHARTH30' ? 30 : 20", "exclusive ${discountPct}% off"],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8-sig')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing verification token {needle!r}')
          print('SIDDHARTH30 verified in browser, cart, product page, server pricing, and recommendation email paths.')
          PY
          if compgen -G 'test/*.test.mjs' > /dev/null; then
            node --test test/*.test.mjs
          fi

      - name: Commit verified changes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-siddharth30.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pricing.js script.js product.html lib/recommendationEmail.js .github/workflows/apply-siddharth30.yml
          git commit -m "feat: add SIDDHARTH30 sitewide product coupon"
          git push origin HEAD:main
