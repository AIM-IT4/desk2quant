name: Send Aanchal Reply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/send-aanchal-reply.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send reply from Desk2Quant
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "to": "aasharma1210@gmail.com",
            "subject": "Re: Mentoring opportunity and session booking",
            "htmlContent": "<div style=\"font-family:Arial,sans-serif;max-width:620px;margin:auto;color:#172033;line-height:1.6\"><p>Hi Aanchal,</p><p>Thanks for reaching out, and also for purchasing the Complete Front Office &amp; Risk Quant Professional Bundle.</p><p>I’d be happy to connect. If you’d like, please book a short session for tomorrow afternoon and we can discuss your model-validation background, your interest in quant finance, and the mentoring path that would make the most sense for you.</p><p><a href=\"https://desk2quant.com/#contact\" style=\"display:inline-block;background:#17365d;color:#fff;text-decoration:none;padding:11px 17px;border-radius:6px\">Book a Session</a></p><p>If you face any issue finding a suitable slot, just reply to this email and I’ll help arrange one.</p><p>Regards,<br>Amit<br>Desk2Quant</p></div>",
            "textContent": "Hi Aanchal,\n\nThanks for reaching out, and also for purchasing the Complete Front Office & Risk Quant Professional Bundle.\n\nI’d be happy to connect. If you’d like, please book a short session for tomorrow afternoon and we can discuss your model-validation background, your interest in quant finance, and the mentoring path that would make the most sense for you.\n\nBook here: https://desk2quant.com/#contact\n\nIf you face any issue finding a suitable slot, just reply to this email and I’ll help arrange one.\n\nRegards,\nAmit\nDesk2Quant"
          }
          JSON
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST 'https://desk2quant.com/api/send-email' \
            -H 'Origin: https://desk2quant.com' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json)
          echo "HTTP_CODE=$HTTP_CODE"
          cat /tmp/resp.json
          echo
          test "$HTTP_CODE" = '200'
          grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/resp.json
