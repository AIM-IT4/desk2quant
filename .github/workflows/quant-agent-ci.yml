name: Quant Agent CI

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'lib/quantAgent*.js'
      - 'api/products.js'
      - 'test/quant-agent*.test.mjs'
      - 'supabase/migrations/*quant_agent*.sql'
      - '.github/workflows/quant-agent-ci.yml'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'lib/quantAgent*.js'
      - 'api/products.js'
      - 'test/quant-agent*.test.mjs'
      - 'supabase/migrations/*quant_agent*.sql'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test:cli
      - name: Validate standalone CLI package
        run: npm pack ./cli --dry-run
