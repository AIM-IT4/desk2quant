name: Vercel Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[vercel-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_Uixpzk6xQLWJ0JpstFnomXfG
      VERCEL_PROJECT_ID: prj_UcS0VGCet8TPsTKkrZQNKKbWKA0X
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Verify Vercel token exists
        run: test -n "$VERCEL_TOKEN"

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
