name: QA FX Nurture Funnel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-fx-nurture.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mocked end-to-end nurture QA
        env:
          NODE_OPTIONS: --experimental-default-type=module
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';

          process.env.SUPABASE_SERVICE_ROLE_KEY = 'test-service-key';
          process.env.SUPABASE_URL = 'https://test.supabase.co';
          process.env.BREVO_API_KEY = 'test-brevo-key';
          process.env.CRON_SECRET = 'test-cron-secret';
          process.env.SENDER_EMAIL = 'hello@desk2quant.com';
          process.env.SENDER_NAME = 'Desk2Quant';

          const jsonResponse = (status, data = {}) => ({
            ok: status >= 200 && status < 300,
            status,
            async json() { return data; },
            async text() { return JSON.stringify(data); }
          });

          let queueBody = null;
          let smtpCount = 0;
          let unsubscribePatched = false;
          let brevoUnlinked = false;

          global.fetch = async (url, options = {}) => {
            const u = String(url);
            const method = String(options.method || 'GET').toUpperCase();

            if (u.includes('/v3/contacts/lists?')) {
              return jsonResponse(200, { lists: [{ id: 55, name: 'Desk2Quant - FX Workbook Leads', folderId: 2 }] });
            }
            if (u.includes('/rest/v1/lead_captures') && method === 'GET') {
              if (u.includes('consent_marketing=eq.true')) return jsonResponse(200, [{ brevo_list_id: 55 }]);
              return jsonResponse(200, []);
            }
            if (u === 'https://api.brevo.com/v3/contacts' && method === 'POST') return jsonResponse(201, { id: 101 });
            if (u.includes('/rest/v1/lead_captures') && method === 'POST') return jsonResponse(201, {});
            if (u.includes('/rest/v1/recommendation_emails') && method === 'GET') return jsonResponse(200, []);
            if (u.endsWith('/rest/v1/recommendation_emails') && method === 'POST') {
              queueBody = JSON.parse(options.body);
              return jsonResponse(201, {});
            }
            if (u === 'https://api.brevo.com/v3/smtp/email' && method === 'POST') {
              smtpCount++;
              return jsonResponse(201, { messageId: '<test-message>' });
            }
            if (u.includes('/v3/contacts/qa%40example.com') && method === 'GET') {
              return jsonResponse(200, { emailBlacklisted: false, listIds: [55] });
            }
            if (u.includes('/rest/v1/lead_captures') && method === 'PATCH') {
              unsubscribePatched = true;
              return jsonResponse(204, {});
            }
            if (u.includes('/rest/v1/recommendation_emails') && method === 'PATCH') return jsonResponse(204, {});
            if (u.includes('/v3/contacts/qa%40example.com') && method === 'PUT') {
              brevoUnlinked = JSON.parse(options.body).unlinkListIds?.includes(55) === true;
              return jsonResponse(204, {});
            }
            throw new Error(`Unexpected fetch: ${method} ${u}`);
          };

          const { default: handler } = await import('./api/send-email.js');
          const { sendRecommendationEmail } = await import('./lib/recommendationEmail.js');

          function makeRes() {
            return {
              statusCode: 200,
              body: null,
              headers: {},
              setHeader(k, v) { this.headers[k] = v; },
              status(code) { this.statusCode = code; return this; },
              json(v) { this.body = v; return this; },
              send(v) { this.body = v; return this; }
            };
          }

          const signupRes = makeRes();
          await handler({
            method: 'POST',
            headers: { origin: 'https://desk2quant.com', 'x-forwarded-for': '127.0.0.1' },
            body: {
              action: 'free-resource-lead',
              email: 'qa@example.com',
              consent: true,
              company: '',
              source: 'qa',
              utmSource: 'linkedin',
              utmMedium: 'organic',
              utmCampaign: 'qa-fx'
            }
          }, signupRes);

          assert.equal(signupRes.statusCode, 200);
          assert.equal(signupRes.body.success, true);
          assert.equal(signupRes.body.nurtureQueued, 4);
          assert.equal(queueBody.length, 4);
          assert.deepEqual(queueBody.map(x => x.trigger_type), ['fx_nurture_1','fx_nurture_2','fx_nurture_3','fx_nurture_4']);
          assert.equal(smtpCount, 1, 'signup should send only the workbook email');

          const nurture = await sendRecommendationEmail({
            customerEmail: 'qa@example.com',
            customerName: 'Quant Learner',
            purchasedProductName: '50 FX Derivatives Problems for Quant Interviews',
            trigger: 'fx_nurture_1',
            couponCode: null,
            SUPABASE_URL: 'https://test.supabase.co',
            SUPABASE_KEY: 'test-service-key',
            BREVO_API_KEY: 'test-brevo-key',
            SENDER_EMAIL: 'hello@desk2quant.com',
            SENDER_NAME: 'Desk2Quant'
          });
          assert.equal(nurture.ok, true);
          assert.equal(smtpCount, 2, 'one nurture send expected after consent checks');

          const token = crypto.createHmac('sha256', 'test-cron-secret')
            .update('qa@example.com|fx_derivatives_workbook', 'utf8').digest('hex');
          const unsubRes = makeRes();
          await handler({
            method: 'GET',
            headers: {},
            query: { action: 'unsubscribe-fx', email: 'qa@example.com', token }
          }, unsubRes);
          assert.equal(unsubRes.statusCode, 200);
          assert.equal(unsubscribePatched, true);
          assert.equal(brevoUnlinked, true);
          assert.match(String(unsubRes.body), /unsubscribed/i);

          console.log('FX nurture QA passed: signup queue=4, delivery=1, nurture consent gate=pass, unsubscribe=pass');
          NODE
