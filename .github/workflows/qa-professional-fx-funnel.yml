name: QA Professional FX Funnel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-professional-fx-funnel.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify FX funnel
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS 'https://desk2quant.com/resources.html?qa_deploy=1' | grep -q 'fxUnlockedNote'; then
              echo 'New resources page is live.'
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo 'Production page did not update in time.' >&2
              exit 1
            fi
            sleep 10
          done

          cat > /tmp/payload.json <<'JSON'
          {
            "action": "free-resource-lead",
            "email": "hello@desk2quant.com",
            "consent": true,
            "company": "",
            "source": "qa",
            "utmSource": "qa",
            "utmMedium": "github_actions",
            "utmCampaign": "professional_fx_funnel",
            "referrer": "https://www.linkedin.com/"
          }
          JSON

          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST 'https://desk2quant.com/api/send-email' \
            -H 'Origin: https://desk2quant.com' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json)

          echo "HTTP_CODE=$HTTP_CODE"
          cat /tmp/resp.json
          echo
          test "$HTTP_CODE" = '200'
          grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/resp.json
          grep -q '50_FX_Derivatives_Quant_Interview_Problems.pdf' /tmp/resp.json
