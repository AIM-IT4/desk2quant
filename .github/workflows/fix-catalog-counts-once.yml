name: One-time catalog count alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-catalog-counts-once.yml'

permissions:
  contents: write

jobs:
  fix-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Align static and shared catalog counts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('index.html'): [
                  ('id="stat-products">36</span>', 'id="stat-products">40</span>'),
                  ('We offer 35 paid products and 3 free resources', 'We offer 36 paid products and 4 free resources'),
              ],
              Path('site-config.js'): [
                  ('products: 36,', 'products: 40,'),
                  ('paidProducts: 33,', 'paidProducts: 36,'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8-sig')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}: {text != original}')

      - name: Commit corrected counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-config.js
          git diff --cached --check
          git commit -m "fix: sync homepage catalog counts with live inventory"
          git push origin HEAD:main
