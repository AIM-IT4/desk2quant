name: QA FX Lead Funnel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-fx-lead-funnel.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Submit real production FX lead form endpoint
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"action":"free-resource-lead","email":"desk2quant@gmail.com","consent":true,"company":""}'
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST 'https://desk2quant.com/api/send-email' \
            -H 'Origin: https://desk2quant.com' \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP_CODE=$HTTP_CODE"
          cat /tmp/resp.json
          echo
          test "$HTTP_CODE" = '200'
          grep -q '"success"[[:space:]]*:[[:space:]]*true' /tmp/resp.json
          grep -q '50_FX_Derivatives_Quant_Interview_Problems.pdf' /tmp/resp.json
