<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06275b"/>
      <stop offset="58%" stop-color="#0a3476"/>
      <stop offset="100%" stop-color="#08a9a2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- baseline / desk line -->
  <line x1="0" y1="470" x2="1200" y2="470" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- three flag poles planted on the baseline, center flag raised/highlighted -->
  <g>
    <line x1="430" y1="470" x2="430" y2="280" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <path d="M430 280 L430 220 L500 232 L430 260 Z" fill="#f43f5e" fill-opacity="0.55"/>

    <line x1="600" y1="470" x2="600" y2="195" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M600 195 L600 120 L700 136 L600 172 Z" fill="#f43f5e"/>

    <line x1="770" y1="470" x2="770" y2="280" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    <path d="M770 280 L770 220 L840 232 L770 260 Z" fill="#f43f5e" fill-opacity="0.55"/>
  </g>
</svg>
