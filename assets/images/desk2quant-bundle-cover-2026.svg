    <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#fff">
      <g transform="translate(0 42)"><circle cx="10" cy="-5" r="6" fill="#1fc9bf"/><text x="27">Products &amp; Pricing</text></g>
      <g transform="translate(320 42)"><circle cx="10" cy="-5" r="6" fill="#1fc9bf"/><text x="27">Risk &amp; Model Validation</text></g>
