<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Desk2Quant Complete Front Office and Risk Quant Bundle</title>
  <desc id="desc">A premium dark navy and gold cover showing the Desk2Quant complete quant system, with PDFs, scripts, interview problems, coding and desk-risk topics. No price is embedded in the artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8df8a"/>
      <stop offset="0.5" stop-color="#d8a82d"/>
      <stop offset="1" stop-color="#f4cb62"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56e6db"/>
      <stop offset="1" stop-color="#17b8b0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="590" cy="170" r="170" fill="#0b3552" opacity="0.6"/>
